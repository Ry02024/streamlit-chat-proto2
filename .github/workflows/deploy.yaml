name: Deploy Streamlit Chat App to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REPO: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPO }}
  SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  RUN_SERVICE_ACCOUNT: ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
  GAR_HOSTNAME: ${{ secrets.GCP_REGION }}-docker.pkg.dev

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - id: 'auth'
      name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Debug Authentication Info
      if: always() # 前のステップが失敗しても実行する
      run: |
        echo "--- Environment Variables ---"
        printenv | grep GOOGLE # Google関連の環境変数を確認
        printenv | grep ACTIONS # Actions関連の環境変数を確認
        echo "--- gcloud auth list ---"
        gcloud auth list || echo "gcloud auth list failed"
        echo "--- gcloud config list ---"
        gcloud config list --all || echo "gcloud config list failed"
        echo "--- Trying to print identity token ---"
        gcloud auth print-identity-token --audiences="sts.googleapis.com" || echo "Failed to print identity token"
        echo "--- End Debug ---"
  
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_HOSTNAME }} --quiet

    - name: Define Docker Image Tag
      run: echo "IMAGE_TAG=${{ env.GAR_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - id: 'deploy'
      name: Deploy to Cloud Run
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: ${{ env.IMAGE_TAG }}
        service_account: ${{ env.RUN_SERVICE_ACCOUNT }}
        allow_unauthenticated: true
